.btn.sm{width:auto;margin:0;padding:6px 10px;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.lbPv{transform-origin:top left}

.lb .lbh{flex:0 0 17%;display:flex;gap:1.5mm;margin-bottom:1.5mm}
.lb .lbhm{flex:1;display:flex;flex-direction:column;min-width:0}
.lb .lbx{flex:1;border:.9mm solid #000;display:flex;flex-direction:column;min-height:0}
.lb .lbr{flex:1;display:flex;min-height:0}
.lb .lbr+.lbr{border-top:.7mm solid #000}

<script>(function(){var M={},C={};function R(n){n=n.replace("./","");if(n==="index")n="index";if(C[n])return C[n].exports;var m=C[n]={exports:{}};M[n](m,m.exports,R);return m.exports}

M["QRMath"]=function(module,exports,require){var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

M["QRPolynomial"]=function(module,exports,require){var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

        [6, 28, 50, 72, 94],

        [6, 30, 54, 78, 102],

        [6, 32, 58, 84, 110],
        [6, 30, 58, 86, 114],
        [6, 34, 62, 90, 118],

        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {

    getBCHDigit : function(data) {

        while (data !== 0) {

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;

            case QRMode.MODE_8BIT_BYTE  : return 8;

            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;

            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

};

M["QRBitBuffer"]=function(module,exports,require){function QRBitBuffer() {

		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},

		var bufIndex = Math.floor(this.length / 8);

			this.buffer.push(0);
		}

		}

	}

var firebaseConfig = {
  apiKey: "BURAYA_API_KEY",
  authDomain: "BURAYA.firebaseapp.com",

(function(){
  var g=function(id){return document.getElementById(id)};
  var CK="lblCfg",shared=null,eRef=null,tpl={},tplKey="",hist=[],user=null,db=null;
  var T=function(s){return String(s==null?"":s).trim().toLocaleUpperCase("tr-TR")};
  var X=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var N=function(n){return Number(n||0).toLocaleString("tr-TR",{maximumFractionDigits:3})};
  var trn=function(s){return String(s==null?"":s).toLocaleLowerCase("tr-TR").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u")};
  var slug=function(v){return trn(v).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)||"x"};
  var ad=function(){return user?(user.displayName||user.email||"kullanıcı"):"kullanıcı"};
  function toast(m){var t=g("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2600)}
  function errText(e){return"Hata: "+((e&&e.message)||e)}

  /* ---- Ayar (en/boy/tasarım) ---- */
  function cfgGet(){var d={w:100,h:100,mag:1};try{var s=JSON.parse(localStorage.getItem(CK)||"{}");if(s.w>0)d.w=s.w;if(s.h>0)d.h=s.h;if(s.mag===0||s.mag===1)d.mag=s.mag}catch(e){}
    if(shared&&shared.w>=20&&shared.h>=20){d.w=shared.w;d.h=shared.h;d.mag=shared.mag===0?0:1}return d}
  function cfgSet(c){try{localStorage.setItem(CK,JSON.stringify(c))}catch(e){}}
  function cfgRead(){var w=parseFloat(String(g("lbW").value).replace(",",".")),h=parseFloat(String(g("lbH").value).replace(",","."));
    return{w:w>=20?w:100,h:h>=20?h:100,mag:g("lbMag").value==="0"?0:1}}

  /* ---- QR ---- */
  var qrMemo={};
  function qrSvg(t){if(qrMemo[t])return qrMemo[t];
    var q=new window.QRLib(-1,0);q.addData(t);q.make();var n=q.getModuleCount(),m=2,d="";
    for(var r=0;r<n;r++){var c=0;while(c<n){if(q.isDark(r,c)){var s=c;while(c<n&&q.isDark(r,c))c++;d+="M"+(s+m)+" "+(r+m)+"h"+(c-s)+"v1h-"+(c-s)+"z"}else c++}}
    var z=n+2*m;return qrMemo[t]='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+z+' '+z+'" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet"><rect width="'+z+'" height="'+z+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
  function qrRow(o){if(!o.qr)return"";
    return'<div class="lbq"><div class="qrc">'+qrSvg(o.qr)+'</div><div class="qt"><div class="lbc" data-g="q"><span>'+X(T(o.qb||"SERİ NO"))+'</span></div><div class="lbc qn"><span>'+X(o.qr)+'</span></div></div></div>'}

  /* ---- Etiket HTML (iş emri programıyla aynı) ---- */
  function row(t,k){return '<div class="lbr">'+(k?'<div class="lbc lbk" data-g="k"><span>'+k+'</span></div>':"")+'<div class="lbc"><span>'+X(T(t))+'</span></div></div>'}
  function lblHtml(o,c){
    var kg=o.kg>0?N(o.kg)+" KG":"";
    var h='<div class="lb" style="width:'+c.w+'mm;height:'+(c.h-0.3)+'mm">';
    if(c.mag)h+='<div class="lbh"><div class="lbc blk"><img src="'+LG_A+'" alt=""></div><div class="lbhm"><div class="lbc" data-g="h"><span>MAG AMBALAJ</span></div><div class="lbc" data-g="h"><span>A.Ş.</span></div></div><div class="lbc blk"><img src="'+LG_B+'" alt=""></div></div>';
    h+='<div class="lbx">'+qrRow(o)+row(o.isAdi,"")+row(o.urun,"ÜRÜN")+row(o.ebat,"EBAT")+row(kg,"KG")+'</div>';
    if(c.mag)h+='<div class="lbf"><div class="lbc" data-g="f"><span>Cumhuriyet Mahallesi Meclis Caddesi No:62 Silivri/İSTANBUL</span></div><div class="lbc" data-g="f"><span>info@magambalaj.com</span></div><div class="lbc" data-g="f"><span>www.magambalaj.com</span></div></div>';
    return h+'</div>';
  }
  function fit(root){
    root.querySelectorAll(".lbc").forEach(function(c){
      var s=c.firstElementChild;if(!s||s.tagName==="IMG")return;
      var av=c.clientWidth-parseFloat(getComputedStyle(c).paddingLeft)*2;
      var sz=Math.max(6,Math.floor(c.clientHeight*(c.dataset.g==="f"?0.85:(c.dataset.g==="q"||c.classList.contains("qn")?0.7:0.82))));
      s.style.fontSize=sz+"px";var w=s.offsetWidth;
      if(w>av&&w>0){sz=Math.max(5,Math.floor(sz*av/w));s.style.fontSize=sz+"px";var n=0;while(s.offsetWidth>av&&sz>5&&n++<40){sz--;s.style.fontSize=sz+"px"}}
    });
    ["k","f","h","q"].forEach(function(gr){
      var a=[].slice.call(root.querySelectorAll('[data-g="'+gr+'"]'));if(!a.length)return;
      var m=Math.min.apply(null,a.map(function(c){return parseFloat(c.firstElementChild.style.fontSize)}));
      a.forEach(function(c){c.firstElementChild.style.fontSize=m+"px"});
    });
  }
  function temizle(){var s=g("lbPage");if(s)s.remove();document.body.classList.remove("lblp");var p=g("lprn");p.innerHTML="";p.className=""}

  /* ---- Form ---- */
  function readForm(){return{isAdi:g("fIs").value.trim(),urun:g("fUrun").value.trim(),ebat:g("fEbat").value.trim(),
    kg:parseFloat(String(g("fKg").value).replace(",","."))||0,qb:g("fQb").value.trim()||"SERİ NO",qr:g("fQr").value.trim(),
    adet:Math.max(1,Math.min(500,parseInt(g("fAdet").value,10)||1))}}
  function setForm(o){["isAdi:fIs","urun:fUrun","ebat:fEbat"].forEach(function(p){p=p.split(":");if(o[p[0]]!=null)g(p[1]).value=o[p[0]]});
    if(o.kg>0)g("fKg").value=o.kg;if(o.qb!=null&&o.qb!=="")g("fQb").value=o.qb;if(o.qr!=null)g("fQr").value=o.qr;prev()}
  function prev(){
    var c=cfgRead(),o=readForm(),P=g("pv"),W=P.parentNode;
    P.style.transform="none";P.innerHTML=lblHtml(o,c);fit(P);
    var pw=c.w*96/25.4,ph=c.h*96/25.4,s=Math.min(1,(W.clientWidth-16)/pw);
    P.style.transform="scale("+s+")";P.style.width=pw+"px";P.style.height=ph+"px";W.style.height=(ph*s+16)+"px";
    var qc=P.querySelector(".qrc"),qw=g("qrWarn"),mm=qc?qc.offsetHeight*25.4/96:99;
    qw.style.display=qc&&mm<22?"block":"none";
    if(qc&&mm<22)qw.textContent="⚠️ QR çok küçük kalıyor (≈"+Math.round(mm)+" mm). Okunmayabilir: etiket boyunu büyütün veya QR içeriğini boş bırakın."}
  var pt;function prevSoon(){clearTimeout(pt);pt=setTimeout(prev,120)}
  ["lbMag","lbW","lbH","fIs","fUrun","fEbat","fKg","fQb","fQr"].forEach(function(id){g(id).addEventListener("input",function(){prevSoon();if(/^lb/.test(id))ortGuncelle()});g(id).addEventListener("change",function(){prevSoon();if(/^lb/.test(id))ortGuncelle()})});
  document.querySelector(".chips").addEventListener("click",function(ev){var b=ev.target.closest("button");if(b){g("fKg").value=b.dataset.kg;prev()}});
  window.addEventListener("resize",prevSoon);

  /* ---- Yazdır + geçmişe kaydet ---- */
  g("printBtn").onclick=function(){
    var c=cfgRead(),o=readForm(),err=g("lbE");
    if(!o.urun&&!o.ebat&&!o.isAdi){err.textContent="Etiket boş: işin adı, ürün veya ebat yazın.";return}
    err.textContent="";cfgSet(c);
    var P=g("lprn");P.className="meas";P.innerHTML=lblHtml(o,c);fit(P);var one=P.innerHTML,out="";
    for(var i=0;i<o.adet;i++)out+=one;P.innerHTML=out;P.className="";
    db.ref("etiketGecmis").push().set({musteri:g("fMus").value.trim(),isAdi:o.isAdi,urun:o.urun,ebat:o.ebat,kg:o.kg,qb:o.qb,qr:o.qr,adet:o.adet,tasarim:c.mag?"markali":"sade",w:c.w,h:c.h,kim:ad(),uid:user.uid,zaman:firebase.database.ServerValue.TIMESTAMP}).then(histYukle).catch(function(er){toast(errText(er))});
    var st=document.createElement("style");st.id="lbPage";st.textContent="@media print{@page{size:"+c.w+"mm "+c.h+"mm;margin:0}}";document.body.appendChild(st);
    document.body.classList.add("lblp");
    var t=document.title;document.title="etiket";
    window.onafterprint=function(){document.title=t;temizle();window.onafterprint=null};
    setTimeout(function(){window.print()},200);
  };

  /* ---- Şablonlar: etiketSablon/{müşteri}/{ürün_ebat} ---- */
  function tplListe(){
    var arr=Object.keys(tpl).map(function(k){return Object.assign({k:k},tpl[k])}).sort(function(a,b){return(a.urun||"").localeCompare(b.urun||"","tr")});
    var s=g("fTpl"),cv=s.value;
    s.innerHTML='<option value="">📋 '+X(g("fMus").value.trim()||"Müşteri")+' şablonları ('+arr.length+')…</option>'+arr.map(function(t){return'<option value="'+X(t.k)+'">'+X([t.urun,t.ebat,t.kg>0?t.kg+" kg":""].filter(Boolean).join(" · "))+'</option>'}).join("");
    if(tpl[cv])s.value=cv}
  var tok=0;
  function tplYukle(){var my=++tok,m=g("fMus").value.trim();tplKey=slug(m||"genel");tpl={};tplListe();
    db.ref("etiketSablon/"+tplKey).once("value").then(function(sn){if(my!==tok)return;tpl=sn.val()||{};tplListe()}).catch(function(){})}
  var mt;g("fMus").addEventListener("input",function(){clearTimeout(mt);mt=setTimeout(tplYukle,400)});
  g("fTpl").addEventListener("change",function(){var m=tpl[g("fTpl").value];if(m)setForm(m)});
  g("tplSave").onclick=function(){var o=readForm(),mus=g("fMus").value.trim();
    if(!o.urun&&!o.ebat)return toast("Ürün veya ebat yazın.");
    if(!mus)return toast("Önce müşteri adını yazın.");
    var key=slug(o.urun+"|"+o.ebat),rec={musteri:mus,isAdi:o.isAdi,urun:o.urun,ebat:o.ebat,kg:o.kg,qb:o.qb,ekleyen:ad(),zaman:firebase.database.ServerValue.TIMESTAMP};
    db.ref("etiketSablon/"+tplKey+"/"+key).set(rec).then(function(){tpl[key]=Object.assign({},rec,{zaman:Date.now()});tplListe();g("fTpl").value=key;toast("📋 Şablon kaydedildi")}).catch(function(er){toast(errText(er))})};
  g("tplDel").onclick=function(){var k=g("fTpl").value;
    if(!k)return toast("Önce silinecek şablonu seçin.");if(!confirm("Seçili şablon silinsin mi?"))return;
    db.ref("etiketSablon/"+tplKey+"/"+k).remove().then(function(){delete tpl[k];tplListe();toast("Şablon silindi")}).catch(function(er){toast(errText(er))})};

  /* ---- Geçmiş: etiketGecmis ---- */
  function histYukle(){
    db.ref("etiketGecmis").limitToLast(60).once("value").then(function(sn){var v=sn.val()||{};
      hist=Object.keys(v).map(function(k){return v[k]}).sort(function(a,b){return(b.zaman||0)-(a.zaman||0)});
      g("hDet").classList.toggle("hide",!hist.length);g("hSum").textContent="🕘 Önceki baskılar ("+hist.length+")";
      g("hList").innerHTML=hist.map(function(h,i){return'<div class="hrow"><span><span class="mut">'+X(new Date(+h.zaman||0).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}))+' · '+X(h.kim||"")+(h.musteri?' · '+X(h.musteri):"")+'</span><br><b>'+X([h.isAdi,h.urun,h.ebat,h.kg>0?h.kg+" kg":""].filter(Boolean).join(" · "))+'</b></span><button type="button" class="btn b6 sm" data-hu="'+i+'" style="flex:none">↺ Kullan</button></div>'}).join("")}).catch(function(){})}
  g("hList").addEventListener("click",function(ev){var b=ev.target.closest("button[data-hu]");if(!b)return;var h=hist[+b.dataset.hu];
    if(h){g("fMus").value=h.musteri||"";tplYukle();setForm(h);window.scrollTo({top:0,behavior:"smooth"})}});

  /* ---- Ortak ölçü: ayarlar/etiket ---- */
  function ortGuncelle(){var c=cfgRead(),o=shared&&shared.w>=20&&shared.h>=20?shared:null,t=g("lbOrt"),b=g("lbOrtBtn");
    t.textContent=o?"📌 Ortak ölçü: "+N(o.w)+" × "+N(o.h)+" mm · "+(o.mag===0?"Sade":"Markalı")+(o.kim?" (ayarlayan: "+o.kim+")":""):"📌 Henüz ortak ölçü ayarlanmadı (şu an her cihazda ayrı).";
    b.classList.toggle("hide",!!o&&o.w===c.w&&o.h===c.h&&(o.mag===0?0:1)===c.mag)}
  g("lbOrtBtn").onclick=function(){var c=cfgRead();
    db.ref("ayarlar/etiket").set({w:c.w,h:c.h,mag:c.mag,kim:ad(),zaman:firebase.database.ServerValue.TIMESTAMP}).then(function(){toast("📌 Ortak etiket ölçüsü kaydedildi")}).catch(function(er){toast(errText(er))})};
  function fillCfg(){var c=cfgGet();g("lbW").value=c.w;g("lbH").value=c.h;g("lbMag").value=String(c.mag)}

  /* ---- Giriş / çıkış ---- */
  var ready=false;
  try{firebase.initializeApp(firebaseConfig);db=firebase.database();ready=true}catch(e){console.error(e)}
  function girisHata(e){var m={"auth/wrong-password":"Şifre yanlış.","auth/user-not-found":"Bu e-posta kayıtlı değil.","auth/invalid-email":"E-posta geçersiz.","auth/invalid-credential":"E-posta veya şifre yanlış.","auth/too-many-requests":"Çok fazla deneme, biraz bekleyin.","auth/network-request-failed":"İnternet bağlantısı yok."};
    return m[e&&e.code]||errText(e)}
  g("lgBtn").onclick=function(){location.reload()};
  function baslat(){fillCfg();tplYukle();histYukle();
    if(eRef)eRef.off();eRef=db.ref("ayarlar/etiket");
    eRef.on("value",function(sn){shared=sn.val()||null;fillCfg();ortGuncelle();prev()},function(){});
    g("uMail").textContent="";prev()}
  /* Giriş ekranı yok: Firebase "Anonim" girişle otomatik girer */
  var started=false;
  if(ready){
    firebase.auth().onAuthStateChanged(function(u){user=u;
      if(u){g("login").classList.add("hide");g("app").classList.remove("hide");if(!started){started=true;baslat()}}});
    firebase.auth().signInAnonymously().catch(function(e){
      g("login").classList.remove("hide");g("app").classList.add("hide");
      g("lgErr").textContent=(e&&e.code==="auth/operation-not-allowed")?"Firebase'de Anonim giriş açık değil (Authentication > Sign-in method > Anonymous).":errText(e)})}
  else{g("login").classList.remove("hide");g("lgErr").textContent="Firebase ayarı (firebaseConfig) girilmemiş."}
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
